# E4 — continuous deployment begins: a merge to main deploys the committed
# state to the dev target. The trigger is the one thing that changed from
# the validate workflows: push to main instead of pull_request.
name: E4 Deploy to dev on merge

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

jobs:
  deploy_dev:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Install the Databricks CLI
        uses: databricks/setup-cli@v1.13.0

      - name: Deploy the committed state
        run: databricks bundle deploy -t dev
